name: Build SHIEL IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Initialize Capacitor iOS
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Compile Unsigned IPA
        run: |
          cd ios/App
          xcodebuild clean -workspace App.xcworkspace -scheme App
          xcodebuild archive -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath App.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          mkdir -p Payload
          cp -r App.xcarchive/Products/Applications/App.app Payload/
          zip -r SHIEL_Liquid_v1.0.ipa Payload

      - name: Export IPA File
        uses: actions/upload-artifact@v4
        with:
          name: SHIEL-Liquid-IPA
          path: ios/App/SHIEL_Liquid_v1.0.ipa
